<main class="recipes-page container">


<section class="page-title">

<h1>
Recipes
</h1>

<p>
Browse the Cucina Orlando collection.
</p>

</section>





<section class="search-area">


<input 
id="recipe-search"
type="text"
placeholder="Search recipes or ingredients..."
>



<button
id="filter-toggle"
type="button"
aria-expanded="false"
aria-controls="filters">

Filters

</button>


</section>






<section id="filters" class="filters">

    <!-- Meal stays controlled/static -->

    <div>

        <h3>
            Meal
        </h3>

        <div id="meal-filters"></div>

    </div>


    <!-- These are generated automatically -->

    <div>

        <h3>
            Protein
        </h3>

        <div id="protein-filters"></div>

    </div>


    <div>

        <h3>
            Cuisine
        </h3>

        <div id="cuisine-filters"></div>

    </div>


    <div>

        <h3>
            Dish Type
        </h3>

        <div id="dishType-filters"></div>

    </div>


    <div>

        <h3>
            Equipment
        </h3>

        <div id="equipment-filters"></div>

    </div>


    <div>

        <h3>
            Tags
        </h3>

        <div id="tags-filters"></div>

    </div>

</section>







<section>

<p id="recipe-count"></p>


<div 
id="recipe-grid"
class="recipe-grid">
</div>


</section>
